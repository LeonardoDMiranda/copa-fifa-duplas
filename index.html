<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d3b66" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1f33" media="(prefers-color-scheme: dark)">
  <title>Copa FIFA em Duplas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- O endereço (#rodadas...) guarda a aba: o link só move o foco (ver ui.js). -->
  <a class="pular-conteudo" id="pular-conteudo" href="#conteudo-principal">Pular para o conteúdo</a>
  <!-- data-icone: ui.js coloca o ícone (js/icones.js) antes do texto. -->
  <header class="topo">
    <img id="logo-campeonato" class="logo-campeonato" alt="" hidden>
    <div class="topo-titulo">
      <div class="topo-linha-titulo">
        <h1 id="titulo-campeonato">Copa FIFA em Duplas</h1>
        <details class="menu menu-campeonatos" id="menu-campeonatos">
          <summary title="Trocar de campeonato ou criar um novo">Trocar<span class="seta" data-icone="abrir-menu"></span></summary>
          <div class="menu-itens" id="itens-campeonatos"></div>
        </details>
      </div>
      <p class="subtitulo" id="subtitulo-campeonato"></p>
    </div>
    <div class="barra-acoes" role="group" aria-label="Ações">
      <button type="button" id="btn-desfazer" data-icone="desfazer" title="Desfazer a última alteração (Ctrl+Z)">Desfazer</button>
      <button type="button" id="btn-telao" data-icone="telao" title="Tela cheia para a TV, alternando as telas a cada 15 s">Modo telão</button>
      <details class="menu" id="menu-campeonato">
        <summary data-icone="configurar" title="Backup e gerenciamento dos campeonatos">Campeonato</summary>
        <div class="menu-itens">
          <button type="button" id="btn-exportar" data-icone="baixar" title="Baixar um backup em JSON">Exportar backup (JSON)</button>
          <button type="button" id="btn-importar" data-icone="enviar" title="Restaurar um backup em JSON ou criar um campeonato a partir de um modelo">Importar backup (JSON)</button>
          <hr>
          <button type="button" id="btn-campeonato-gerenciar" data-icone="configurar" title="Duplicar, arquivar, exportar ou excluir os campeonatos guardados">Gerenciar campeonatos</button>
        </div>
      </details>
      <input type="file" id="arquivo-importar" accept=".json,application/json" hidden>
    </div>
    <p id="status-salvamento" class="status-salvamento"></p>
  </header>

  <!-- Etapas: antes de confirmar o calendário, os 3 passos da preparação; depois, as 3 telas da temporada
       e Ajustes. ui.js mostra só as abas da fase atual, numera os atalhos (Alt+1...) e preenche os indicadores. -->
  <nav class="abas" aria-label="Etapas do campeonato">
    <div class="abas-lista" role="tablist">
      <button type="button" role="tab" class="aba-btn" id="aba-btn-configuracao" aria-controls="aba-configuracao" data-aba="configuracao" hidden>
        <span class="passo" aria-hidden="true">1</span>Configuração<span class="indicador" id="indicador-configuracao"></span></button>
      <button type="button" role="tab" class="aba-btn" id="aba-btn-jogadores" aria-controls="aba-jogadores" data-aba="jogadores" hidden>
        <span class="passo" aria-hidden="true">2</span>Jogadores<span class="indicador" id="indicador-jogadores"></span></button>
      <button type="button" role="tab" class="aba-btn" id="aba-btn-sorteio" aria-controls="aba-sorteio" data-aba="sorteio" hidden>
        <span class="passo" aria-hidden="true">3</span>Sorteio<span class="indicador" id="indicador-sorteio"></span></button>
      <button type="button" role="tab" class="aba-btn" id="aba-btn-rodadas" aria-controls="aba-rodadas" data-aba="rodadas" hidden>
        Rodadas<span class="indicador" id="indicador-rodadas"></span></button>
      <button type="button" role="tab" class="aba-btn" id="aba-btn-classificacao" aria-controls="aba-classificacao" data-aba="classificacao" hidden>
        Classificação<span class="indicador" id="indicador-classificacao"></span></button>
      <button type="button" role="tab" class="aba-btn" id="aba-btn-mata-mata" aria-controls="aba-mata-mata" data-aba="mata-mata" hidden>
        Mata-mata<span class="indicador" id="indicador-mata-mata"></span></button>
      <button type="button" role="tab" class="aba-btn" id="aba-btn-campeonato" aria-controls="aba-campeonato" data-aba="campeonato" hidden>
        <span data-icone="configurar"></span>Ajustes<span class="indicador" id="indicador-campeonato"></span></button>
    </div>
  </nav>

  <!-- Uma só região anunciada pelo leitor de tela, sem interromper (os avisos não têm role próprio). -->
  <div id="avisos" class="avisos" aria-live="polite"></div>
  <div id="lembrete-backup" class="lembrete-backup" hidden></div>

  <!-- Cada tela monta o próprio conteúdo dentro da sua aba: Telas.<nome>.criar(app, raiz). -->
  <main class="painel" id="conteudo-principal" tabindex="-1">
    <section id="aba-configuracao" class="aba" role="tabpanel" aria-labelledby="aba-btn-configuracao" hidden></section>
    <section id="aba-jogadores" class="aba" role="tabpanel" aria-labelledby="aba-btn-jogadores" hidden></section>
    <section id="aba-sorteio" class="aba" role="tabpanel" aria-labelledby="aba-btn-sorteio" hidden></section>
    <section id="aba-rodadas" class="aba aba-rodadas" role="tabpanel" aria-labelledby="aba-btn-rodadas" hidden></section>
    <section id="aba-classificacao" class="aba" role="tabpanel" aria-labelledby="aba-btn-classificacao" hidden></section>
    <section id="aba-mata-mata" class="aba" role="tabpanel" aria-labelledby="aba-btn-mata-mata" hidden></section>
    <section id="aba-campeonato" class="aba" role="tabpanel" aria-labelledby="aba-btn-campeonato" hidden></section>
    <section id="aba-campeonatos" class="aba" aria-labelledby="titulo-tela-campeonatos" hidden></section>
  </main>

  <div id="telao" class="telao" hidden></div>

  <!-- Scripts clássicos (sem módulos) para funcionar em file://. A ordem importa. -->
  <script src="js/regras.js"></script>
  <script src="js/estado.js"></script>
  <script src="js/abas.js"></script>
  <script src="js/campeonatos.js"></script>
  <script src="js/icones.js"></script>
  <script src="js/util.js"></script>
  <script src="js/exportar.js"></script>
  <script src="js/telao.js"></script>
  <script src="js/telas/configuracao.js"></script>
  <script src="js/telas/jogadores.js"></script>
  <script src="js/telas/sorteio.js"></script>
  <script src="js/telas/rodadas.js"></script>
  <script src="js/telas/classificacao.js"></script>
  <script src="js/telas/mata-mata.js"></script>
  <script src="js/telas/campeonato.js"></script>
  <script src="js/telas/campeonatos.js"></script>
  <script src="js/telas/ficha.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
