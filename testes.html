<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Testes – Copa FIFA em Duplas</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; background: #f4f6f8; color: #1d2733; }
    h1 { margin: 0 0 4px; font-size: 1.4rem; }
    #resumo { font-weight: 600; margin: 8px 0 20px; padding: 10px 14px; border-radius: 6px; }
    #resumo.ok { background: #d9f2df; color: #145a26; }
    #resumo.falha { background: #fbdcdc; color: #8a1616; }
    .caso { background: #fff; border-left: 5px solid #999; border-radius: 4px; padding: 10px 14px; margin-bottom: 10px; }
    .caso.passou { border-color: #2e9e4a; }
    .caso.falhou { border-color: #d03030; }
    .caso.pendente { border-color: #c9a227; }
    .caso h2 { font-size: 1rem; margin: 0 0 6px; }
    .caso ul { margin: 0; padding-left: 20px; font-size: .9rem; }
    .caso li.erro { color: #b01e1e; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Testes das regras</h1>
  <div>Casos obrigatórios de <code>docs/ESCOPO.md</code>, seção 6.</div>
  <div id="resumo"></div>
  <div id="casos"></div>

  <script src="testes/dados-exemplo.js"></script>
  <script src="js/regras.js"></script>
  <script src="js/estado.js"></script>
  <script src="js/campeonatos.js"></script>
  <script src="js/icones.js"></script>
  <script src="js/util.js"></script>
  <script src="js/exportar.js"></script>
  <script src="js/telao.js"></script>
  <script>
    "use strict";

    const { classificacaoBase, jogosSexta } = window.DADOS_INICIAIS;
    const casos = [];

    function caso(titulo, fn) { casos.push({ titulo, fn }); }
    function pendente(titulo, motivo) { casos.push({ titulo, pendente: motivo }); }

    // Monta os jogos de sexta com os resultados informados: { j1: {tipo, ...}, ... }
    function jogosCom(resultados = {}) {
      return jogosSexta.map((j) => ({ ...j, resultado: resultados[j.id] || null }));
    }
    function placar(gols1, gols2) { return { tipo: "placar", gols1, gols2 }; }
    function wo(vencedor) { return { tipo: "wo", vencedor }; }

    // A fixture é uma classificação que já tem jogos: a ordem do array vale como desempate manual
    // inicial para os empates técnicos que já existem nela (ex.: Jogador 05 à frente de Jogador 32).
    function desempatesDaBase(base) {
      return Regras.detectarEmpatesTecnicos(base).map((ids) => ({ jogadores: ids }));
    }

    function classificar(resultados, desempates = desempatesDaBase(classificacaoBase)) {
      return Regras.calcularClassificacao(classificacaoBase, jogosCom(resultados), desempates);
    }
    // Estrelas fictícias (1 a 5, em rodízio): o sorteio exige que todos tenham nível.
    function comEstrelas(jogadores) { return jogadores.map((j, i) => ({ ...j, estrelas: (i % 5) + 1 })); }
    function linha(tabela, id) { return tabela.find((l) => l.id === id); }
    function baseDe(id) { return classificacaoBase.find((l) => l.id === id); }

    // Asserções: cada uma registra uma linha no relatório do caso.
    function criarVerificador(registro) {
      return {
        igual(atual, esperado, descricao) {
          const ok = JSON.stringify(atual) === JSON.stringify(esperado);
          registro.push({ ok, texto: ok ? descricao : `${descricao} — esperado ${JSON.stringify(esperado)}, veio ${JSON.stringify(atual)}` });
        },
        verdadeiro(cond, descricao) {
          registro.push({ ok: Boolean(cond), texto: descricao });
        },
        campos(obj, esperado, descricao) {
          for (const [k, v] of Object.entries(esperado)) this.igual(obj[k], v, `${descricao}: ${k} = ${v}`);
        },
      };
    }

    // 1
    caso("1. Base sem jogos: ordem idêntica à planilha oficial", (t) => {
      const tabela = classificar();
      t.igual(tabela.map((l) => l.id), classificacaoBase.map((l) => l.id), "ordem 1º Jogador 23 … 32º Jogador 01");
      t.igual(tabela[0].nome, "Jogador 23", "1º Jogador 23");
      t.igual(tabela[31].nome, "Jogador 01", "32º Jogador 01");
      t.verdadeiro(tabela.every((l) => l.variacao === 0), "ninguém sobe nem desce em relação à base");
    });

    // 2
    caso("2. j1 = 2×1 (Jogador 20 + Jogador 12 vencem)", (t) => {
      const tabela = classificar({ j1: placar(2, 1) });
      const p12 = linha(tabela, "p12");
      t.campos(p12, { pontos: 15, v: 5, gp: 24, gc: 4, sg: 20, posicao: 2 }, "Jogador 12");
      t.campos(linha(tabela, "p23"), { posicao: 1, sg: 24 }, "Jogador 23");
      t.campos(linha(tabela, "p17"), { posicao: 3, sg: 18 }, "Jogador 17");
      t.campos(linha(tabela, "p20"), { pontos: 12, v: 4, sg: 8 }, "Jogador 20");
      t.igual(linha(tabela, "p29").d, baseDe("p29").d + 1, "Jogador 29 D+1");
      t.igual(linha(tabela, "p27").d, baseDe("p27").d + 1, "Jogador 27 D+1");
    });

    // 3
    caso("3. j2 = 0×0: empate sem gols vale 0 ponto", (t) => {
      const tabela = classificar({ j2: placar(0, 0) });
      for (const id of ["p31", "p21", "p05", "p25"]) {
        const l = linha(tabela, id), b = baseDe(id);
        t.igual(l.e, b.e + 1, `${b.nome} E+1`);
        t.igual(l.pontos, b.pontos, `${b.nome} pontos inalterados (${b.pontos})`);
      }
      t.igual(linha(tabela, "p21").pontos, 10, "Jogador 21 continua com 10");
    });

    // 4
    caso("4. j2 = 1×1: empate com gols vale 1 ponto", (t) => {
      const tabela = classificar({ j2: placar(1, 1) });
      for (const id of ["p31", "p21", "p05", "p25"]) {
        t.igual(linha(tabela, id).pontos, baseDe(id).pontos + 1, `${baseDe(id).nome} +1 pt`);
      }
      const p21 = linha(tabela, "p21"), p24 = linha(tabela, "p24");
      t.campos(p21, { pontos: 11, v: 3, sg: 14 }, "Jogador 21");
      t.verdadeiro(p21.posicao < p24.posicao, `Jogador 21 (${p21.posicao}º) à frente de Jogador 24 (${p24.posicao}º)`);
    });

    // 5
    caso("5. j5 = W.O. a favor da dupla 1", (t) => {
      const tabela = classificar({ j5: wo(1) });
      t.campos(linha(tabela, "p11"), { pontos: 12, v: 4, gp: 28, sg: 15 }, "Jogador 11");
      t.igual(linha(tabela, "p04").pontos, 10, "Jogador 04 10 pts");
      for (const id of ["p32", "p16"]) {
        const l = linha(tabela, id), b = baseDe(id);
        t.igual(l.d, b.d + 1, `${b.nome} D+1`);
        t.igual(l.gc, b.gc + 3, `${b.nome} GC+3`);
        t.igual(l.pontos, b.pontos, `${b.nome} não pontua`);
      }
    });

    // 6
    caso("6. Desempate por vitórias: j4 = 1×1", (t) => {
      const tabela = classificar({ j4: placar(1, 1) });
      const p03 = linha(tabela, "p03");
      t.campos(p03, { pontos: 9, v: 2 }, "Jogador 03");
      const com3v = tabela.filter((l) => l.pontos === 9 && l.v === 3);
      t.verdadeiro(com3v.length > 0, `há ${com3v.length} jogadores com 9 pts e 3 V`);
      t.verdadeiro(com3v.every((l) => l.posicao < p03.posicao), "Jogador 03 abaixo de todos com 9 pts e 3 V");
    });

    // 7
    caso("7. Desempate por gols pró (base)", (t) => {
      const tabela = classificar();
      const p09 = linha(tabela, "p09"), p13 = linha(tabela, "p13");
      t.campos(p09, { pontos: 9, v: 3, sg: 4, gp: 22 }, "Jogador 09");
      t.campos(p13, { pontos: 9, v: 3, sg: 4, gp: 12 }, "Jogador 13");
      t.verdadeiro(p09.posicao < p13.posicao, "Jogador 09 à frente de Jogador 13");
    });

    // 8
    caso("8. Empate técnico (base): Jogador 05 × Jogador 32", (t) => {
      const grupos = Regras.detectarEmpatesTecnicos(classificacaoBase);
      t.igual(grupos, [["p05", "p32"]], "único empate técnico na base é Jogador 05/Jogador 32");

      const tabela = classificar();
      const bon = linha(tabela, "p05"), val = linha(tabela, "p32");
      t.igual(bon.posicao, 8, "com o desempate inicial, Jogador 05 em 8º");
      t.igual(val.posicao, 9, "Jogador 32 em 9º");
      t.verdadeiro(bon.empateTecnico && bon.empateTecnico.ordemManual, "grupo marcado como empate técnico com ordem manual");

      const invertida = classificar({}, [{ jogadores: ["p32", "p05"] }]);
      t.igual(linha(invertida, "p32").posicao, 8, "ordem manual invertida põe Jogador 32 em 8º");

      const semManual = classificar({}, []);
      t.igual(linha(semManual, "p05").posicao, 8, "sem ordem manual: alfabética provisória (Jogador 05 8º)");
      t.verdadeiro(linha(semManual, "p05").empateTecnico.ordemManual === false, "sem ordem manual: ⚖️ marcado como provisório");

      const outroGrupo = classificar({}, [{ jogadores: ["p32", "p05", "p11"] }]);
      t.igual(linha(outroGrupo, "p32").posicao, 9, "ordem manual de grupo diferente é ignorada");

      const desfeito = classificar({ j2: placar(1, 1) });
      t.igual(linha(desfeito, "p05").empateTecnico, null, "j2 = 1×1 desfaz o empate técnico de Jogador 05");
    });

    // ---------- Extras da Fase 2 ----------

    caso("F2.1 Resultado inválido não conta", (t) => {
      const base = classificar();
      for (const r of [placar(-1, 0), placar(1.5, 0), placar("2", 1), wo(3), { tipo: "outro" }]) {
        t.igual(classificar({ j1: r }).map((l) => [l.id, l.pontos, l.gp]), base.map((l) => [l.id, l.pontos, l.gp]),
          `${JSON.stringify(r)} é ignorado`);
      }
    });

    caso("F2.2 Ordem manual é descartada quando o grupo muda", (t) => {
      const desempates = desempatesDaBase(classificacaoBase);
      const com00 = Regras.podarDesempatesManuais(classificacaoBase, jogosCom({ j2: placar(0, 0) }), desempates);
      t.igual(com00, desempates, "j2 = 0×0 mantém o grupo Jogador 05/Jogador 32 e a ordem manual");
      const com11 = Regras.podarDesempatesManuais(classificacaoBase, jogosCom({ j2: placar(1, 1) }), desempates);
      t.igual(com11, [], "j2 = 1×1 desfaz o grupo e descarta a ordem manual");
    });

    caso("F2.3 Definir ordem manual substitui a do mesmo grupo", (t) => {
      const inicial = [{ jogadores: ["p05", "p32"] }, { jogadores: ["p19", "p16"] }];
      const nova = Regras.definirOrdemDesempate(inicial, ["p32", "p05"]);
      t.igual(nova, [{ jogadores: ["p19", "p16"] }, { jogadores: ["p32", "p05"] }], "uma entrada por grupo");
      t.igual(inicial[0].jogadores, ["p05", "p32"], "não altera o array original");
    });

    // Armazenamento em memória com a interface do localStorage (não mexe nos dados reais do app).
    function memoria(inicial = {}) {
      const dados = { ...inicial };
      return {
        dados,
        get length() { return Object.keys(dados).length; },
        key: (i) => Object.keys(dados)[i] ?? null,
        getItem: (k) => (k in dados ? dados[k] : null),
        setItem: (k, v) => { dados[k] = String(v); },
        removeItem: (k) => { delete dados[k]; },
      };
    }
    // Estado v2 de teste: os 32 jogadores de 2026 (zerados) e os 7 jogos de sexta, todos na semana 1.
    // `ajustar` recebe o objeto antes de ser salvo (para montar casos inválidos).
    function dadosV2(ajustar) {
      const dados = {
        versao: 2,
        campeonato: {
          nome: "Copa de teste",
          config: { ...Regras.REGRAS_PADRAO },
          jogadores: comEstrelas(classificacaoBase.map((l) => ({ id: l.id, nome: l.nome }))),
          sorteio: null,
        },
        jogos: jogosSexta.map((j) => ({ id: j.id, semana: 1, dupla1: j.dupla1.slice(), dupla2: j.dupla2.slice(), resultado: null })),
        desempatesManuais: [],
        mataMata: null,
        historico: [],
      };
      if (ajustar) ajustar(dados);
      return dados;
    }
    function memoria2026() { return memoria({ [Estado.CHAVE]: JSON.stringify(dadosV2()) }); }
    function criarEstado(arm = memoria2026()) { return Estado.criar(arm); }
    function lancar(est, id, resultado) {
      return est.modificar(`teste ${id}`, (s) => { s.jogos.find((j) => j.id === id).resultado = resultado; });
    }

    caso("F2.5 Persistência: reabrir recupera os lançamentos", (t) => {
      const arm = memoria2026();
      const est = criarEstado(arm);
      lancar(est, "j1", placar(2, 1));
      lancar(est, "j5", wo(1));
      const reaberto = Estado.criar(arm);
      t.igual(reaberto.atual().jogos.find((j) => j.id === "j1").resultado, placar(2, 1), "j1 continua 2×1");
      t.igual(reaberto.atual().jogos.find((j) => j.id === "j5").resultado, wo(1), "j5 continua W.O.");
      t.igual(reaberto.atual().historico.length, 2, "histórico também é recuperado");
      t.verdadeiro(!("classificacao" in JSON.parse(arm.dados[Estado.CHAVE])), "classificação calculada não é salva");
    });

    caso("F2.6 Desfazer volta o último lançamento", (t) => {
      const est = criarEstado();
      lancar(est, "j1", placar(2, 1));
      lancar(est, "j1", placar(3, 1));
      t.igual(est.desfazer(), "teste j1", "desfazer devolve a descrição");
      t.igual(est.atual().jogos[0].resultado, placar(2, 1), "j1 voltou para 2×1");
      est.desfazer();
      t.igual(est.atual().jogos[0].resultado, null, "j1 voltou a ficar pendente");
      t.igual(est.desfazer(), null, "sem histórico, desfazer não faz nada");
      t.igual(lancar(est, "j1", null), false, "alteração sem efeito não entra no histórico");
      for (let i = 0; i < 40; i++) lancar(est, "j2", placar(i % 5, 0));
      t.igual(est.atual().historico.length, Estado.MAX_HISTORICO, `histórico limitado a ${Estado.MAX_HISTORICO}`);
    });

    caso("F2.7 Mudar o placar descarta a ordem manual do grupo (e desfazer a traz de volta)", (t) => {
      const est = criarEstado();
      lancar(est, "j1", placar(2, 1)); // Jogador 12 e Jogador 20 empatam em tudo
      est.modificar("inverter", (s) => { s.desempatesManuais = Regras.definirOrdemDesempate(s.desempatesManuais, ["p20", "p12"]); });
      t.igual(est.atual().desempatesManuais, [{ jogadores: ["p20", "p12"] }], "ordem manual guardada");
      lancar(est, "j6", placar(1, 1)); // Jogador 12 ganha 1 ponto: o grupo se desfaz
      t.igual(est.atual().desempatesManuais, [], "ordem manual descartada");
      est.desfazer();
      t.igual(est.atual().desempatesManuais, [{ jogadores: ["p20", "p12"] }], "desfazer restaura a ordem manual");
    });

    caso("F2.8 Exportar, resetar e importar restaura tudo", (t) => {
      const est = criarEstado();
      lancar(est, "j1", placar(2, 1));
      lancar(est, "j3", wo(2));
      est.modificar("inverter", (s) => { s.desempatesManuais = Regras.definirOrdemDesempate(s.desempatesManuais, ["p20", "p12"]); });
      const backup = est.exportarJSON();
      const foto = () => ({ campeonato: est.atual().campeonato, jogos: est.atual().jogos, desempatesManuais: est.atual().desempatesManuais });
      const antes = foto();

      est.resetar();
      t.igual(est.atual().jogos, [], "resetar volta ao campeonato vazio: sem jogos");
      t.igual(est.atual().campeonato.jogadores, [], "e sem jogadores");
      t.igual(est.atual().desempatesManuais, [], "e sem desempates");

      est.importarJSON(backup);
      t.igual(foto(), antes, "importar restaura campeonato, jogos e desempates");
      t.igual(est.ultimaAcao(), "importar backup", "importação pode ser desfeita");
    });

    caso("F2.9 Importação inválida é recusada sem alterar nada", (t) => {
      const est = criarEstado();
      lancar(est, "j1", placar(2, 1));
      const antes = est.exportarJSON();
      const tentativas = {
        "texto que não é JSON": "{ quebrado",
        "versão errada": JSON.stringify({ versao: 99 }),
        "backup do formato antigo (versão 1)": JSON.stringify({ versao: 1, jogos: [] }),
        "campeonato ausente": JSON.stringify({ versao: 2, jogos: [] }),
        "gols negativos": JSON.stringify(dadosV2((d) => { d.jogos[0].resultado = placar(-2, 0); })),
        "jogador desconhecido no desempate": JSON.stringify(dadosV2((d) => { d.desempatesManuais = [{ jogadores: ["x", "y"] }]; })),
        "jogador desconhecido numa dupla": JSON.stringify(dadosV2((d) => { d.jogos[0].dupla1 = ["p20", "fulano"]; })),
        "mesmo jogador nas duas duplas": JSON.stringify(dadosV2((d) => { d.jogos[0].dupla2 = ["p20", "p27"]; })),
        "id de jogo repetido": JSON.stringify(dadosV2((d) => { d.jogos[1].id = "j1"; })),
        "semana inválida": JSON.stringify(dadosV2((d) => { d.jogos[0].semana = 0; })),
        "semana além das semanas do campeonato": JSON.stringify(dadosV2((d) => { d.jogos[0].semana = 9; })),
        "jogador repetido": JSON.stringify(dadosV2((d) => { d.campeonato.jogadores.push({ id: "p20", nome: "Outro Jogador 20" }); })),
        "vagas abaixo de 4": JSON.stringify(dadosV2((d) => { d.campeonato.config.vagasFaseFinal = 3; })),
      };
      for (const [nome, texto] of Object.entries(tentativas)) {
        let erro = null;
        try { est.importarJSON(texto); } catch (e) { erro = e; }
        t.verdadeiro(erro, `${nome}: recusado (${erro && erro.message})`);
      }
      t.igual(JSON.parse(est.exportarJSON()).jogos, JSON.parse(antes).jogos, "estado continua o mesmo");
    });

    caso("F6.1 Recarregar pega alterações salvas por outra janela", (t) => {
      const arm = memoria2026();
      const telao = criarEstado(arm);
      const organizador = criarEstado(arm);
      let avisos = 0;
      telao.aoMudar(() => avisos++);
      lancar(organizador, "j1", placar(2, 1));
      t.igual(telao.atual().jogos[0].resultado, null, "antes de recarregar, a outra janela ainda não vê o placar");
      telao.recarregar();
      t.igual(telao.atual().jogos[0].resultado, placar(2, 1), "depois de recarregar, vê o j1 = 2×1");
      t.igual(avisos, 1, "recarregar avisa a tela para redesenhar");
    });

    caso("F2.10 Dados salvos corrompidos: guarda cópia e recomeça da base", (t) => {
      const arm = memoria({ [Estado.CHAVE]: "{ lixo" });
      const est = Estado.criar(arm);
      t.verdadeiro(est.status().aviso, "mostra aviso ao organizador");
      t.verdadeiro(Object.keys(arm.dados).some((k) => k.startsWith(`${Estado.CHAVE}-corrompido-`)), "conteúdo corrompido guardado à parte");
      t.igual(est.atual().campeonato.jogadores, [], "recomeça com um campeonato vazio");
    });

    // 9
    caso("9. Mata-mata: prorrogação, pênaltis e final MD3", (t) => {
      const semi = { gols1: 1, gols2: 1, prorrogacao1: 0, prorrogacao2: 0, penaltis1: 4, penaltis2: 3 };
      const a = Regras.analisarPartida(semi);
      t.igual(a.vencedor, 1, "1×1, prorrogação 0×0, pênaltis 4×3 → vence a dupla 1");
      t.igual(a.decididoEm, "penaltis", "decidido nos pênaltis");

      const final = Regras.analisarSerie([{ gols1: 2, gols2: 0 }, { gols1: 3, gols2: 1 }], 3);
      t.igual(final.vencedor, 1, "final: dupla 1 faz 2×0 na série e é campeã");
      t.igual(final.vitorias, [2, 0], "série 2×0");
      t.igual(final.partidasVisiveis, 2, "a final termina em 2 jogos (o 3º não aparece)");
    });

    // ---------- Extras da Fase 3 ----------

    caso("F3.1 Partida: etapas pendentes e empate nos pênaltis", (t) => {
      t.igual(Regras.analisarPartida({ gols1: 2, gols2: null }).precisa, "placar", "placar incompleto");
      t.igual(Regras.analisarPartida({ gols1: 0, gols2: 3 }).vencedor, 2, "0×3 → dupla 2 no tempo normal");
      t.igual(Regras.analisarPartida({ gols1: 2, gols2: 2 }).precisa, "prorrogacao", "2×2 pede prorrogação");
      t.igual(Regras.analisarPartida({ gols1: 2, gols2: 2, prorrogacao1: 0, prorrogacao2: 1 }).vencedor, 2, "prorrogação 0×1 → dupla 2");
      t.igual(Regras.analisarPartida({ gols1: 0, gols2: 0, prorrogacao1: 1, prorrogacao2: 1 }).precisa, "penaltis", "prorrogação empatada pede pênaltis");
      const empatePen = Regras.analisarPartida({ gols1: 0, gols2: 0, prorrogacao1: 0, prorrogacao2: 0, penaltis1: 5, penaltis2: 5 });

      Array.from({ length: n }, (_, i) => ({ id: `j${i}`, nome: `Jogador ${String(i + 1).padStart(2, "0")}` }))), []);

    const estruturaDe = (vagas, extra = {}) => Regras.estruturaDoMataMata(Regras.formatoDaConfig(configCom(vagas, extra)));
    function lancarMMVencedor(mm, chave, lado, tabela) {
      const gols = lado === 1 ? [1, 0] : [0, 1];
      let novo = Regras.definirCampoPartida(mm, chave, 0, "gols1", gols[0]);
      novo = Regras.definirCampoPartida(novo, chave, 0, "gols2", gols[1]);
      return Regras.fixarDuplasJogadas(novo, tabela);
    }

    caso("MM15 PNG e telão mostram o W.O. no lugar do placar, sem mudar o tamanho da imagem", (t) => {
      const tabela = tabelaDe(32);
      const nomePorId = new Map(tabela.map((l) => [l.id, l.nome]));
      const mm = Regras.marcarWO(Regras.gerarMataMata(tabela, configCom(8)), tabela, "semi1", 1);
      const r = Regras.resolverMataMata(mm, tabela);
      t.igual([Exportar.valorDoLado(r.semi1, 1), Exportar.valorDoLado(r.semi1, 2)], ["W.O.", "–"], "a dupla ausente mostra W.O. e a que avança, traço");
      t.verdadeiro(/W\.O\. da dupla 1.*dupla 2 avança sem placar/.test(Exportar.detalheDoConfronto(r.semi1)), "a linha de detalhe explica o W.O.");
      t.igual(Exportar.valorDoLado(r.semi2, 1), "–", "os outros confrontos seguem como antes");
      const imagem = Exportar.desenharMataMata(r, nomePorId, { geradoEm: new Date(2026, 9, 2, 15, 30), nome: "Copa de teste" });
      t.igual(imagem.height, 1458, "a imagem tem a mesma altura do chaveamento sem W.O.");

      // O "W.O." tem que caber na faixa do vencedor (margem de 14 px do cartão), não encostar na borda.
      const proto = CanvasRenderingContext2D.prototype;
      const { fillText, roundRect } = proto;
      const cartoes = [];
      const textos = [];
      proto.roundRect = function (x, y, w, h, ...resto) { cartoes.push({ x, y, w, h }); return roundRect.call(this, x, y, w, h, ...resto); };
      proto.fillText = function (texto, x, y, ...resto) {
        textos.push({ texto, x, y, align: this.textAlign, largura: this.measureText(texto).width });
        return fillText.call(this, texto, x, y, ...resto);
      };
      try {
        Exportar.desenharMataMata(r, nomePorId, { geradoEm: new Date(2026, 9, 2, 15, 30), nome: "Copa de teste" });
      } finally {
        proto.fillText = fillText;
        proto.roundRect = roundRect;
      }
      const wo = textos.find((s) => s.texto === "W.O.");
      t.verdadeiro(Boolean(wo), "o W.O. foi desenhado");
      const cartao = cartoes.find((c) => c.w > 300 && wo.y > c.y && wo.y < c.y + c.h && wo.x > c.x && wo.x < c.x + c.w);
      const direita = wo.align === "center" ? wo.x + wo.largura / 2 : wo.align === "right" ? wo.x : wo.x + wo.largura;
      t.verdadeiro(direita <= cartao.x + cartao.w - 14, `o W.O. termina a ${Math.round(cartao.x + cartao.w - direita)} px da borda do cartão (mínimo 14)`);

      const dados = dadosV2((d) => { d.campeonato.config.vagasFaseFinal = 8; });
      const tab = Regras.calcularClassificacao(Regras.baseDosJogadores(dados.campeonato.jogadores), dados.jogos, [], dados.campeonato.config);
      dados.mataMata = Regras.marcarWO(Regras.gerarMataMata(tab, dados.campeonato.config), tab, "semi1", 2, dados.campeonato.config);
      const est = Estado.criar(memoria({ [Estado.CHAVE]: JSON.stringify(dados) }));
      const raiz = document.createElement("div");
      raiz.id = "telao";
      raiz.hidden = true;
      document.body.appendChild(raiz);
      const telao = Telao.criar(est);
      try {
        telao.abrir({ telaCheia: false });
        raiz.querySelector("#telao-proxima").click();
        raiz.querySelector("#telao-proxima").click();
        const valores = [...raiz.querySelectorAll(".telao-confronto")[0].querySelectorAll(".valor")].map((v) => v.textContent);
        t.igual(valores, ["–", "W.O."], "no telão, a Semi 1 mostra o W.O. da dupla 2");
        t.verdadeiro(raiz.querySelector(".telao-confronto .detalhe").textContent.includes("sem placar"), "e o detalhe");
      } finally {
        telao.fechar();
        raiz.remove();
      }
    });

      const r = JSON.parse(sortearG(9));
      const grupoDoJogo = jogadores.find((x) => x.id === r.calendario[0].dupla1[0]).grupo;
      const deOutro = jogadores.find((j) => j.grupo !== grupoDoJogo);
      const misturado = Regras.trocarJogadorNoCalendario(r.calendario, 0, 1, 0, deOutro.id);
      t.verdadeiro(Regras.avaliarCalendario(jogadores, misturado, configGrupos(4, 2)).violacoes.some((v) => v.includes("grupos diferentes")),
        "troca à mão que põe alguém de outro grupo no jogo: violação");
      t.verdadeiro(Regras.gerarCalendario(jogadoresFicticios(32), { jogosPorJogador: 6, semanas: 8, semente: 1, grupos: { quantidade: 4, classificados: 2 } }).erro,
        "com grupos e sem os grupos formados: erro");
    });

    caso("G6 Classificação por grupo", (t) => {
      const cfg = configGrupos(2, 2, { jogosPorJogador: 4, semanas: 4 });
      const jogadores = Regras.formarGruposPorPotes(jogadoresFicticios(16), 2, 1).jogadores;
      const calendario = Regras.gerarCalendario(jogadores, { jogosPorJogador: 4, semanas: 4, semente: 1, grupos: cfg.grupos }).calendario;
      const jogos = Regras.calendarioParaJogos(calendario).map((j) => ({ ...j, resultado: placar(1, 0) }));
      const base = Regras.baseDosJogadores(jogadores);
      t.verdadeiro(base.every((l) => l.grupo), "a base leva o grupo de cada jogador");
      const tabelas = Regras.classificacaoDosGrupos(base, jogos, [], cfg);
      t.igual(tabelas.map((g) => g.grupo), ["A", "B"], "uma tabela por grupo");
      for (const { grupo, linhas } of tabelas) {
        t.verdadeiro(linhas.length === 8 && linhas.every((l) => l.grupo === grupo), `Grupo ${grupo}: só os 8 jogadores do grupo`);
        t.igual(linhas.map((l) => l.posicao), [1, 2, 3, 4, 5, 6, 7, 8], `Grupo ${grupo}: posições de 1 a 8`);
        t.igual(linhas.reduce((s, l) => s + l.v, 0), 16, `Grupo ${grupo}: 8 jogos com vencedor, 16 vitórias individuais`);
      }
      const ate1 = Regras.classificacaoDosGrupos(base, jogos, [], cfg, 1);
      t.verdadeiro(ate1.every((g) => g.linhas.reduce((s, l) => s + l.jogos, 0) === 4 * calendario.filter((j) => j.semana === 1 && g.linhas.some((l) => l.id === j.dupla1[0])).length),
        "após a semana 1: só os jogos da semana 1 de cada grupo");
      const zerado = Regras.classificacaoDosGrupos(base, [], [], cfg);
      t.verdadeiro(zerado.every((g) => g.linhas.every((l) => !l.empateTecnico)), "sem jogos: nenhum empate técnico sinalizado");
    });

    caso("G7 Semeadura por campanha: critérios, ordem do organizador e ausentes", (t) => {
      const cfg = configGrupos(2, 2);
      const lista = Regras.semeaduraPorCampanha(tabelasG(), cfg);
      t.igual(lista.map((l) => l.id), ["a1", "b1", "a2", "b2", "a3", "b3", "a4", "b4"], "classificados pela campanha, depois os demais");
      t.igual(lista.map((l) => l.posicao), [1, 2, 3, 4, 5, 6, 7, 8], "posição = lugar na lista");
      t.igual(lista.slice(0, 4).map((l) => l.classificado), [true, true, true, true], "os 2 primeiros de cada grupo são os classificados");
      t.igual([lista[1].posicaoNoGrupo, lista[2].posicaoNoGrupo], [1, 2], "B1 e A2 iguais em tudo: vale a melhor posição no grupo");
      t.igual(lista[4].empateSemeadura, { grupo: ["a3", "b3"], ordemManual: false }, "A3 e B3 iguais em tudo (até a posição): empate, ordem alfabética provisória");
      t.igual(lista[6].empateSemeadura, null, "A4 e B4 sem jogos: empate não sinalizado");
      const manual = Regras.semeaduraPorCampanha(tabelasG(), cfg, [{ jogadores: ["b3", "a3"] }]);
      t.igual(manual.slice(4, 6).map((l) => l.id), ["b3", "a3"], "ordem do organizador decide o empate");
      t.igual(manual[4].empateSemeadura.ordemManual, true, "empate com ordem manual");
      const semA2 = Regras.semeaduraPorCampanha(tabelasG(), cfg, [], ["a2"]);
      t.igual(semA2.map((l) => l.id), ["a1", "b1", "b2", "a3", "b3", "a4", "b4", "a2"], "A2 ausente: o próximo do grupo A (A3) se classifica e a lista é refeita pela campanha");
      t.igual([semA2[3].posicaoNoGrupo, semA2[3].classificado, semA2[7].ausente], [2, true, true], "A3 vira o 2º do grupo; o ausente vai para o fim");
      const tabelasB = tabelasG();
      tabelasB[0].linhas[0] = { ...tabelasB[0].linhas[0], gp: 5, gc: 0 };
      tabelasB[1].linhas[0] = { ...tabelasB[1].linhas[0], pontos: 9, v: 3, gp: 6, gc: 1 };
      t.igual(Regras.semeaduraPorCampanha(tabelasB, cfg).slice(0, 2).map((l) => l.id), ["b1", "a1"], "mesmos pontos, V e saldo: gols pró decide");
    });

    caso("G8 Mata-mata com grupos: duplas pela semeadura e substituto do mesmo grupo", (t) => {
      const cfg = configGrupos(2, 2);
      const lista = Regras.semeaduraPorCampanha(tabelasG(), cfg);
      const mm = Regras.gerarMataMata(lista, cfg);
      t.igual([mm.final.dupla1, mm.final.dupla2], [["a1", "b2"], ["b1", "a2"]], "4 vagas: final com 1º + 4º × 2º + 3º da semeadura");
      t.igual(Regras.proximoSubstituto(mm, lista, cfg, "b1"), "b3", "B1 ausente: entra o próximo do grupo B (B3), não o A3");
      t.igual(Regras.proximoSubstituto(mm, lista, cfg), "a3", "sem informar o ausente: o próximo da lista geral");
      const esgotado = { ...mm, substituidos: ["b3", "b4"] };
      t.igual(Regras.proximoSubstituto(esgotado, lista, cfg, "b1"), "a3", "grupo B sem mais ninguém: o próximo da lista geral");
      const novo = Regras.substituirJogador(mm, lista, "final", 2, "b1", cfg);
      t.igual([novo.final.dupla2, novo.substituidos], [["b3", "a2"], ["b1"]], "substituir: B3 entra no lugar de B1, na mesma dupla");
      const comAusente = Regras.semeaduraPorCampanha(tabelasG(), cfg, [], ["a2"]);
      const mmAusente = Regras.gerarMataMata(comAusente, cfg, ["a2"]);
      t.igual([mmAusente.final.dupla1, mmAusente.final.dupla2, mmAusente.ausentes], [["a1", "a3"], ["b1", "b2"], ["a2"]], "ausente antes do chaveamento: semeadura refeita e ausente guardado");
      const resolvido = Regras.resolverMataMata(mmAusente, comAusente, cfg);
      t.igual(resolvido.final.dupla1, ["a1", "a3"], "resolver lê a mesma semeadura");
      t.igual(Regras.avisosParaGerarChaveamento([], lista, cfg), [], "sem empate entre os classificados: sem aviso");
      const empatados = tabelasG();
      empatados[1].linhas[1] = { ...empatados[0].linhas[1], id: "b2", nome: "B2", posicao: 2 };
      empatados[1].linhas[0] = { ...empatados[0].linhas[0], id: "b1", nome: "B1", posicao: 1 };
      t.verdadeiro(Regras.avisosParaGerarChaveamento([], Regras.semeaduraPorCampanha(empatados, cfg), cfg).some((a) => a.includes("na semeadura da fase final")),
        "empate entre classificados de grupos diferentes sem ordem: aviso");
      const semGrupos = Regras.REGRAS_PADRAO;
      const tabela = Regras.calcularClassificacao(Regras.baseDosJogadores(jogadoresFicticios(10)), [], [], { config: semGrupos });
      const mmLiga = Regras.gerarMataMata(tabela, semGrupos);
      t.igual(Regras.proximoSubstituto(mmLiga, tabela, semGrupos, tabela[0].id), tabela[8].id, "liga única: o ausente informado não muda nada (próximo da classificação)");
    });

    caso("G9 Desempates com grupos: valem os do grupo e os da semeadura", (t) => {
      const cfg = configGrupos(2, 2);
      const jogadores = [
        { id: "x", nome: "X", grupo: "A" }, { id: "y", nome: "Y", grupo: "A" },
        { id: "w", nome: "W", grupo: "B" }, { id: "z", nome: "Z", grupo: "B" },
      ];
      const base = Regras.baseDosJogadores(jogadores);
      // Grupo A empatado (X, Y), com a ordem do organizador Y antes de X; grupo B empatado, W antes de Z
      // (alfabética). Semeadura: Y e W empatam como 1ºs; X e Z como 2ºs.
      const dm = [{ jogadores: ["y", "x"] }, { jogadores: ["w", "x"] }, { jogadores: ["x", "z"] }];
      t.igual(Regras.podarDesempatesManuais(base, [], dm, cfg), [dm[0], dm[2]],
        "mantém a ordem do grupo A (Y, X) e a da semeadura entre os 2ºs (X, Z); descarta W e X, que não estão empatados");
      t.igual(Regras.podarDesempatesManuais(base, [], dm, Regras.REGRAS_PADRAO), [],
        "liga única: os 4 empatados formam um grupo só e nenhuma dessas ordens vale");
      const lista = Regras.classificacaoDaFaseFinal(base, [], [dm[0], dm[2]], cfg);
      t.igual(lista.map((l) => l.id), ["w", "y", "x", "z"], "classificacaoDaFaseFinal monta a semeadura: 1ºs (alfabética), depois 2ºs (ordem do organizador)");
      t.igual(Regras.classificacaoDaFaseFinal(base, [], [], Regras.REGRAS_PADRAO).map((l) => l.id), ["w", "x", "y", "z"], "liga única: a classificação de sempre");
    });

    caso("G10 Grupos no estado: salvos, validados, levados por backup, duplicar e modelo", (t) => {
      const jogadoresG = Regras.formarGruposPorPotes(comEstrelas(classificacaoBase.map((l) => ({ id: l.id, nome: l.nome }))), 4, 1).jogadores;
      const comGrupos = (d) => {
        d.campeonato.config = configGrupos(4, 2);
        d.campeonato.jogadores = jogadoresG;
      };
      const arm = memoria({ [Estado.CHAVE]: JSON.stringify(dadosV2(comGrupos)) });
      const est = Estado.criar(arm);
      t.igual(est.atual().campeonato.config.grupos, { quantidade: 4, classificados: 2 }, "config.grupos é carregado");
      t.igual(est.atual().campeonato.jogadores.map((j) => j.grupo), jogadoresG.map((j) => j.grupo), "o grupo de cada jogador é carregado");
      const texto = est.exportarJSON();
      est.resetar();
      t.igual(est.atual().campeonato.config.grupos, null, "resetar volta à liga única");
      est.importarJSON(texto);
      t.igual(est.atual().campeonato.jogadores.map((j) => j.grupo), jogadoresG.map((j) => j.grupo), "exportar e importar levam os grupos");
      const antigo = Estado.criar(memoria2026()).atual();
      t.igual([antigo.campeonato.config.grupos, antigo.campeonato.jogadores.some((j) => "grupo" in j)], [null, false], "backup antigo, sem grupos: liga única, sem migração");
      const letraErrada = Estado.validarEstado(dadosV2((d) => { comGrupos(d); d.campeonato.jogadores = jogadoresG.map((j, i) => (i ? j : { ...j, grupo: "Z" })); }));
      t.verdadeiro(!("grupo" in letraErrada.campeonato.jogadores[0]), "grupo que não existe na config: jogador fica sem grupo (a formar)");
      const semConfig = Estado.validarEstado(dadosV2((d) => { d.campeonato.jogadores = jogadoresG; }));
      t.verdadeiro(semConfig.campeonato.jogadores.every((j) => !("grupo" in j)), "liga única: o grupo dos jogadores é descartado");
      let erro = null;
      try { Estado.validarEstado(dadosV2((d) => { comGrupos(d); d.campeonato.config.vagasFaseFinal = 12; })); } catch (e) { erro = e; }
      t.verdadeiro(erro && erro.message.includes("grupos × classificados"), `config de grupos incoerente é recusada (${erro && erro.message})`);
      const extra = Estado.validarEstado(dadosV2((d) => { comGrupos(d); d.campeonato.config.grupos = { quantidade: 4, classificados: 2, lixo: 1 }; }));
      t.igual(extra.campeonato.config.grupos, { quantidade: 4, classificados: 2 }, "só os campos conhecidos de config.grupos");

      const armC = memoria({ [Estado.CHAVE]: JSON.stringify(dadosV2(comGrupos)) });
      const camps = Campeonatos.criar(armC);
      const a = camps.ativo();
      const esperado = [{ quantidade: 4, classificados: 2 }, jogadoresG.map((j) => j.grupo)];
      const copia = edicaoGuardada(armC, camps.duplicar(a));
      t.igual([copia.campeonato.config.grupos, copia.campeonato.jogadores.map((j) => j.grupo)], esperado, "duplicar leva os grupos");
      const modelo = JSON.parse(camps.exportarModelo(a));
      t.igual([modelo.campeonato.config.grupos, modelo.campeonato.jogadores.map((j) => j.grupo)], esperado, "o modelo leva os grupos");
      const doModelo = edicaoGuardada(armC, camps.criarDeModelo(JSON.stringify(modelo)));
      t.igual([doModelo.campeonato.config.grupos, doModelo.campeonato.jogadores.map((j) => j.grupo)], esperado, "edição criada do modelo tem os grupos");
    });

    // ---------- Base visual e acessível (Fase 18) ----------

    caso("U1 plural: singular só com 1", (t) => {
      t.igual(Util.plural(0, "jogador", "jogadores"), "0 jogadores", "0 usa o plural");
      t.igual(Util.plural(1, "jogador", "jogadores"), "1 jogador", "1 usa o singular");
      t.igual(Util.plural(3, "jogo pendente", "jogos pendentes"), "3 jogos pendentes", "3 usa o plural (expressão inteira)");
      t.igual(Util.plural(1250, "cenário", "cenários"), "1.250 cenários", "número com separador de milhar");
    });

    caso("U2 numero: formato brasileiro", (t) => {
      t.igual(Util.numero(4.5, 1), "4,5", "vírgula decimal");
      t.igual(Util.numero(4.46, 1), "4,5", "arredonda para as casas pedidas");
      t.igual(Util.numero(3, 1), "3,0", "casas fixas");
      t.igual(Util.numero(1234567), "1.234.567", "ponto no milhar, sem casas por padrão");
    });

    caso("U3 rotuloDoJogo: semana e número do jogo na semana, nunca o id", (t) => {
      const jogos = [
        { id: "s1-j1", semana: 1 }, { id: "s1-j2", semana: 1 },
        { id: "s3-j1", semana: 3 }, { id: "s3-j2", semana: 3 }, { id: "x", semana: 3 },
      ];
      const numeros = Regras.numerosNaSemana(jogos);
      t.igual(Util.rotuloDoJogo(jogos[1], numeros), "Semana 1 · Jogo 2", "2º jogo da semana 1");
      t.igual(Util.rotuloDoJogo(jogos[4], numeros), "Semana 3 · Jogo 3", "o número vem da ordem na semana, não do id");
      t.igual([...Regras.numerosNaSemana(jogosEmSemanas()).values()], [1, 2, 1, 2, 1, 2, 3], "fixture: números reiniciam a cada semana");
      t.verdadeiro(Util.numerosNaSemana(jogos) === Util.numerosNaSemana(jogos), "Util guarda o resultado enquanto a lista não muda");
    });

    caso("U4 botaoIcone: nome acessível e ícone decorativo", (t) => {
      let clicou = false;
      const b = Util.botaoIcone({ icone: "editar", rotulo: "Renomear Jogador 01", id: "b1", class: "mini", onclick: () => { clicou = true; } });
      t.igual(b.tagName, "BUTTON", "é um botão");
      t.igual(b.type, "button", "type=button (não envia formulário)");
      t.igual(b.getAttribute("aria-label"), "Renomear Jogador 01", "aria-label com o rótulo");
      t.igual(b.title, "Renomear Jogador 01", "title igual ao aria-label");
      t.igual(b.className, "botao-icone mini", "classe própria mais as pedidas");
      t.igual(b.textContent.trim(), "", "sem texto visível (só o ícone)");
      t.igual(b.querySelector("svg").getAttribute("aria-hidden"), "true", "ícone escondido do leitor de tela");
      b.click();
      t.verdadeiro(clicou, "onclick funciona");
      t.verdadeiro(Util.botaoIcone({ icone: "fechar", rotulo: "Fechar", disabled: true }).disabled, "aceita disabled");
    });

    caso("U5 Icones.svg: todos decorativos, na cor do texto", (t) => {
      const nomes = Icones.nomes();
      t.verdadeiro(nomes.length >= 16, `${nomes.length} ícones`);
      for (const nome of ["desfazer", "backup", "telao", "imagem", "editar", "remover", "subir", "descer", "confirmar",
        "anterior", "proximo", "alerta", "ok", "trofeu", "empate", "ajuda"]) {
        t.verdadeiro(nomes.includes(nome), `tem o ícone "${nome}" do plano`);
      }
      const ruins = nomes.filter((nome) => {
        const s = Icones.svg(nome);
        return s.namespaceURI !== "http://www.w3.org/2000/svg" || s.getAttribute("aria-hidden") !== "true"
          || s.getAttribute("focusable") !== "false" || s.getAttribute("stroke") !== "currentColor" || !s.childElementCount;
      });
      t.igual(ruins, [], "todos são SVG com aria-hidden, focusable=false, currentColor e desenho");
      t.verdadeiro(Icones.svg("ok", "extra").classList.contains("extra"), "aceita classe extra");
      let erro = null;
      try { Icones.svg("nao-existe"); } catch (e) { erro = e; }
      t.verdadeiro(erro, "ícone desconhecido lança erro (em vez de um botão vazio)");
    });

    caso("U6 Erro junto do campo: atributos e mensagem", (t) => {
      t.igual(Util.atributosDeErro("x-erro", null), {}, "sem erro: nenhum atributo");
      t.igual(Util.atributosDeErro("x-erro", "Use números."), { "aria-invalid": "true", "aria-describedby": "x-erro" }, "com erro: aria-invalid e aria-describedby");
      t.igual(Util.mensagemDeErro("x-erro", null), null, "sem erro: nada para desenhar");
      const p = Util.mensagemDeErro("x-erro", "Use números.");
      t.igual([p.id, p.className, p.textContent], ["x-erro", "erro-campo", "Use números."], "com erro: <p> com o id ligado ao campo");
    });

    // Execução e relatório
    let passaram = 0, falharam = 0, pendentes = 0;
    const container = document.getElementById("casos");
    for (const c of casos) {
      const div = document.createElement("div");
      const h2 = document.createElement("h2");
      const ul = document.createElement("ul");
      let status;
      if (c.pendente) {
        status = "pendente";
        pendentes++;
        const li = document.createElement("li");
        li.textContent = `Pendente: ${c.pendente}.`;
        ul.appendChild(li);
      } else {
        const registro = [];
        try {
          c.fn(criarVerificador(registro));
        } catch (erro) {
          registro.push({ ok: false, texto: `Exceção: ${erro.message}` });
        }
        const ok = registro.length > 0 && registro.every((r) => r.ok);
        status = ok ? "passou" : "falhou";
        ok ? passaram++ : falharam++;
        for (const r of registro) {
          const li = document.createElement("li");
          li.textContent = `${r.ok ? "✔" : "✘"} ${r.texto}`;
          if (!r.ok) li.className = "erro";
          ul.appendChild(li);
        }
      }
      div.className = `caso ${status}`;
      h2.textContent = `${status === "passou" ? "✅" : status === "falhou" ? "❌" : "⏳"} ${c.titulo}`;
      div.append(h2, ul);
      container.appendChild(div);
    }

    const resumo = document.getElementById("resumo");
    resumo.textContent = `${passaram} passaram, ${falharam} falharam` + (pendentes ? `, ${pendentes} pendentes (fases futuras)` : "");
    resumo.className = falharam ? "falha" : "ok";
    document.title = `${falharam ? "❌" : "✅"} Testes – Copa FIFA em Duplas`;
  </script>
</body>
</html>
